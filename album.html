<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALBUM - ARION</title>
    <link rel="stylesheet" href="style.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&family=Noto+Sans+Arabic:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <div class="main-wrapper">
        <nav class="navbar">
            <div class="nav-container">
                <div class="nav-left">
                    <div class="logo">
                        <a href="index.html" style="text-decoration: none; color: inherit; display: flex; align-items: center; gap: 0.8rem;">
                            <div class="logo-circle">
                                <img src="1.png" alt="Logo" class="logo-img">
                            </div>
                            <span class="logo-text">ARION</span>
                        </a>
                    </div>
                    <div class="nav-separator"></div>
                    <div class="nav-simple-links">
                        <a href="index.html" class="nav-link">Home</a>
                        <a href="album.html" class="nav-link active">Album</a>
                        <a href="videos.html" class="nav-link">Videos</a>
                    </div>
                </div>
            </div>
        </nav>

        <section class="album-hero">
            <div class="bg-text-container">
                <div class="bg-text">
                    <svg viewBox="0 0 1400 500" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
                        <text x="50%" y="50%" text-anchor="middle" dominant-baseline="middle">GALLERY</text>
                    </svg>
                </div>
            </div>

            <div class="hero-content">
                <h1 class="main-title"><span class="glitch-text">ALB</span><span>UM</span></h1>
                <div class="tags-container">
                    <span class="tag">Snapshots</span>
                    <span class="tag">Moments</span>
                    <span class="tag">Art</span>
                </div>
            </div>
        </section>

        <section class="gallery-section">
            <div class="gallery-container">
                <div class="gallery-grid">
                    <!-- Image Card 1 -->
                    <div class="gallery-card" style="--delay: 0.1s">
                        <div class="card-inner">
                            <img src="img/1.png" alt="Album Image 1" loading="lazy">
                            <div class="card-overlay">
                                <span class="card-tag">#ARION</span>
                            </div>
                        </div>
                    </div>
                    <div class="gallery-card" style="--delay: 0.2s">
                        <div class="card-inner">
                            <img src="img/2.png" alt="Album Image 2" loading="lazy">
                            <div class="card-overlay">
                                <span class="card-tag">#MOMENT</span>
                            </div>
                        </div>
                    </div>
                    <div class="gallery-card" style="--delay: 0.3s">
                        <div class="card-inner">
                            <img src="img/3.png" alt="Album Image 3" loading="lazy">
                            <div class="card-overlay">
                                <span class="card-tag">#VTUBER</span>
                            </div>
                        </div>
                    </div>
                    <div class="gallery-card" style="--delay: 0.4s">
                        <div class="card-inner">
                            <img src="img/4.png" alt="Album Image 4" loading="lazy">
                            <div class="card-overlay">
                                <span class="card-tag">#GAMER</span>
                            </div>
                        </div>
                    </div>
                    <div class="gallery-card" style="--delay: 0.5s">
                        <div class="card-inner">
                            <img src="img/5.png" alt="Album Image 5" loading="lazy">
                            <div class="card-overlay">
                                <span class="card-tag">#EGYPT</span>
                            </div>
                        </div>
                    </div>
                    <div class="gallery-card" style="--delay: 0.6s">
                        <div class="card-inner">
                            <img src="img/6.png" alt="Album Image 6" loading="lazy">
                            <div class="card-overlay">
                                <span class="card-tag">#CREATIVE</span>
                            </div>
                        </div>
                    </div>
                    <div class="gallery-card" style="--delay: 0.7s">
                        <div class="card-inner">
                            <img src="img/7.png" alt="Album Image 7" loading="lazy">
                            <div class="card-overlay">
                                <span class="card-tag">#COOL</span>
                            </div>
                        </div>
                    </div>
                    <div class="gallery-card" style="--delay: 0.8s">
                        <div class="card-inner">
                            <img src="img/8.png" alt="Album Image 8" loading="lazy">
                            <div class="card-overlay">
                                <span class="card-tag">#VIBE</span>
                            </div>
                        </div>
                    </div>
                    <div class="gallery-card" style="--delay: 0.9s">
                        <div class="card-inner">
                            <img src="img/9.png" alt="Album Image 9" loading="lazy">
                            <div class="card-overlay">
                                <span class="card-tag">#ART</span>
                            </div>
                        </div>
                    </div>
                    <div class="gallery-card" style="--delay: 1.0s">
                        <div class="card-inner">
                            <img src="img/10.png" alt="Album Image 10" loading="lazy">
                            <div class="card-overlay">
                                <span class="card-tag">#COLLECTION</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <footer class="main-footer">
            <div class="footer-container">
                <div class="footer-logo">
                    <span class="footer-ar-text">AR</span>
                    <span class="footer-logo-text">ARION <span class="pink-dot">.</span></span>
                </div>
                
                <div class="footer-center">
                    <p>&copy; اريون - All Rights Reserved.</p>
                </div>
                
                <div class="footer-links">
                    <a href="#">Privacy Policy</a>
                    <a href="#">Terms of Service</a>
                </div>
            </div>
        </footer>
    </div>

    <div id="imageModal" class="image-modal">
        <span class="close-modal">&times;</span>
        <img class="modal-content" id="img01">
    </div>

    <script src="script.js"></script>
    <script>
        const modal = document.getElementById("imageModal");
        const modalImg = document.getElementById("img01");
        const cards = document.querySelectorAll(".gallery-card img");

        cards.forEach(img => {
            img.onclick = function() {
                modal.style.display = "flex";
                modalImg.src = this.src;
            }
        });

        document.querySelector(".close-modal").onclick = function() {
            modal.style.display = "none";
        }

        modal.onclick = function(e) {
            if(e.target === modal) modal.style.display = "none";
        }

        lucide.createIcons();
    </script>
    <script src="security.js"></script>

</body>
</html>
